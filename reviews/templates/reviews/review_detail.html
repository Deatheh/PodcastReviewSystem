{% extends "base.html" %}

{% block content %}
<h1>Отзыв #{{ review.id }}</h1>
<p><strong>Подкаст:</strong> {{ review.podcast_title }}</p>
<p><strong>Автор:</strong> {{ review.username }}</p>
<p><strong>Оценка:</strong> {{ review.rating|default:"Не указана" }}</p>
<p><strong>Текст:</strong> {{ review.text }}</p>
{% endblock %}
