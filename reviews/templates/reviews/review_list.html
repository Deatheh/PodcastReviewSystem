{% extends "base.html" %}

{% block content %}
<h1>Все отзывы</h1>
<ul>
{% for r in reviews %}
    <li>
        <a href="{% url 'reviews:detail' r.id %}">Отзыв #{{ r.id }}</a>
        к подкасту "{{ r.podcast_title }}" от {{ r.username }}
        {% if r.rating %}(Оценка: {{ r.rating }}){% endif %}
    </li>
{% empty %}
    <li>Отзывов пока нет.</li>
{% endfor %}
</ul>
{% endblock %}
