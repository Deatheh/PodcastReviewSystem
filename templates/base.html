{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}PodcastReview{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{% static 'homepage/css/style.css' %}">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="{% url 'homepage:index' %}">PodcastReview</a>
            <div class="navbar-nav">
                <a class="nav-link" href="{% url 'homepage:index' %}">Главная</a>
                <a class="nav-link" href="{% url 'podcasts:list' %}">Подкасты</a>
                <a class="nav-link" href="{% url 'podcasts:search' %}">Поиск</a>
                <a class="nav-link" href="{% url 'reviews:list' %}">Отзывы</a>
                <a class="nav-link" href="{% url 'reviews:statistics' %}">Статистика</a>
            </div>
        </div>
    </nav>

    <main class="container mt-4">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="container mt-5 mb-3 text-center text-muted">
        <p>&copy; <span id="current-year"></span> PodcastReviewSystem</p>
    </footer>

    <script src="{% static 'homepage/js/main.js' %}"></script>
</body>
</html>
